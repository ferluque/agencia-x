<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>AGENCIA X · CANAL SEGURO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050607;
    --red:#ff2b3d;
    --red-deep:#7a0f1a;
    --amber:#ffb020;
    --grey:#8a9296;
    --white:#f5f5f0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    font-family:'JetBrains Mono',monospace;
    color:var(--white);
    -webkit-text-size-adjust:100%;
  }
  body{
    min-height:100dvh;
    display:flex;align-items:flex-start;justify-content:center;
    position:relative;
    padding:
      max(28px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(40px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.75) 100%);
    pointer-events:none;z-index:3;
  }
  .scanlines{
    position:fixed;inset:0;z-index:4;pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.035) 0px,
      rgba(255,255,255,0.035) 1px,
      transparent 2px,
      transparent 3px
    );
    animation:scan 9s linear infinite;
    opacity:0.6;
  }
  @keyframes scan{0%{background-position:0 0;}100%{background-position:0 40px;}}

  .flash{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:var(--red);opacity:0;
  }
  .flash.active{animation:flashpulse 0.9s ease-in-out infinite;}
  @keyframes flashpulse{
    0%,100%{opacity:0;}
    50%{opacity:0.16;}
  }

  .stage{
    position:relative;z-index:5;
    width:min(560px,100%);
    text-align:center;
    padding:10px 6px 40px;
  }

  .eyebrow{
    font-size:11px;letter-spacing:0.25em;color:var(--amber);
    text-transform:uppercase;margin-bottom:30px;opacity:0.85;
  }
  .eyebrow span{opacity:0.5;margin:0 6px;}

  .emblem{width:72px;height:72px;margin:0 auto 20px;position:relative;}
  .ring{
    position:absolute;inset:0;border-radius:50%;
    border:1px solid var(--red-deep);
  }
  .ring.r1{animation:pulse 2.6s ease-out infinite;}
  .ring.r2{animation:pulse 2.6s ease-out infinite;animation-delay:0.65s;}
  .ring.r3{animation:pulse 2.6s ease-out infinite;animation-delay:1.3s;}
  @keyframes pulse{
    0%{transform:scale(0.4);opacity:0.9;border-color:var(--red);}
    100%{transform:scale(1.9);opacity:0;border-color:var(--red-deep);}
  }
  .emblem svg{position:relative;z-index:2;width:100%;height:100%;}

  h1{
    font-size:clamp(21px,6.5vw,32px);
    font-weight:700;letter-spacing:0.01em;
    margin:0 0 10px;
    color:var(--white);
    text-shadow:0 0 18px rgba(255,43,61,0.45);
  }
  h1.glitch{animation:glitch 4.5s infinite;}
  @keyframes glitch{
    0%,92%,100%{text-shadow:0 0 18px rgba(255,43,61,0.45);transform:translate(0,0);}
    93%{text-shadow:-2px 0 var(--red), 2px 0 var(--amber);transform:translate(-1px,0);}
    94%{text-shadow:2px 0 var(--red), -2px 0 var(--amber);transform:translate(1px,0);}
    95%{text-shadow:0 0 18px rgba(255,43,61,0.45);transform:translate(0,0);}
  }

  .status{
    font-size:13px;color:var(--grey);letter-spacing:0.05em;margin-bottom:30px;
  }
  .status .cursor{animation:blink 1s step-end infinite;color:var(--red);}
  @keyframes blink{50%{opacity:0;}}

  button{
    font-family:'JetBrains Mono',monospace;
    background:transparent;
    border:1px solid var(--red);
    color:var(--white);
    padding:14px 28px;
    min-height:48px;
    font-size:13px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    cursor:pointer;
    border-radius:2px;
    transition:background 0.2s, color 0.2s, box-shadow 0.2s;
    -webkit-appearance:none;appearance:none;
  }
  button:hover:not(:disabled){
    background:var(--red);
    box-shadow:0 0 24px rgba(255,43,61,0.5);
  }
  button:focus-visible{outline:2px solid var(--amber);outline-offset:3px;}
  button:disabled{border-color:var(--grey);color:var(--grey);cursor:default;}

  .btn-amber{border-color:var(--amber);opacity:0;}
  .btn-amber:hover:not(:disabled){
    background:var(--amber);color:#050607;
    box-shadow:0 0 24px rgba(255,176,32,0.5);
  }
  .btn-amber.show{animation:fadeInUp 0.6s ease forwards;}
  @keyframes fadeInUp{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
  }

  .decrypt{
    margin-top:26px;
    text-align:left;
    border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.02);
    border-radius:3px;
    padding:16px 16px;
    font-size:13px;
    line-height:1.75;
    color:var(--grey);
    display:none;
    -webkit-user-select:text;user-select:text;
  }
  .decrypt.show{display:block;}
  .decrypt .line{opacity:0;white-space:pre-wrap;word-break:break-word;transition:opacity 0.3s ease;}
  .decrypt .line.in{opacity:1;color:var(--white);}
  .decrypt .line.out{opacity:0 !important;}
  .decrypt .line.head{color:var(--amber);letter-spacing:0.08em;}
  .decrypt .prompt{color:var(--red);margin-right:6px;}
  .decrypt .sign{color:var(--amber);}

  .foot{
    margin-top:24px;font-size:10.5px;letter-spacing:0.15em;
    color:var(--grey);opacity:0.55;text-transform:uppercase;
  }
  .foot .dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--red);margin-right:6px;
    animation:blink 1.4s step-end infinite;
  }

  @media (prefers-reduced-motion: reduce){
    .ring, h1.glitch, .flash.active, .scanlines{animation:none !important;}
  }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="flash" id="flash"></div>

<div class="stage">
  <div class="eyebrow">AGENCIA X <span>·</span> CANAL SEGURO <span>·</span> NIVEL 5</div>

  <div class="emblem">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <svg viewBox="0 0 100 100" fill="none">
      <path d="M50 6 L90 22 V50 C90 74 72 90 50 96 C28 90 10 74 10 50 V22 Z" stroke="#ff2b3d" stroke-width="2" opacity="0.85"/>
      <line x1="30" y1="30" x2="70" y2="70" stroke="#f5f5f0" stroke-width="3" stroke-linecap="round"/>
      <line x1="70" y1="30" x2="30" y2="70" stroke="#f5f5f0" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>

  <h1 class="glitch" id="title">OPERACIÓN ESPEJISMO</h1>
  <div class="status" id="status">ESTADO: ESPERANDO ACTIVACIÓN<span class="cursor">_</span></div>

  <button id="activateBtn">▶ Activar protocolo</button>

  <div class="decrypt" id="decrypt"></div>

  <button id="missionBtn" class="btn-amber" style="display:none;margin-top:26px;">▶ Iniciar misión</button>

  <div class="foot"><span class="dot"></span>Transmisión cifrada · Agencia X Central</div>
</div>

<script>
const btn = document.getElementById('activateBtn');
const flash = document.getElementById('flash');
const status = document.getElementById('status');
const decrypt = document.getElementById('decrypt');
const missionBtn = document.getElementById('missionBtn');

const connectLines = [
  '> enlace establecido...',
  '> descifrando transmisión...',
  ''
];

const introLines = [
  'Agente L, protocolo de contingencia ACTIVADO.',
  'Motivo: reubicación de emergencia fuera de zona segura.',
  '',
  'Abandonad posiciones actuales en cuanto sea posible.',
  'El vehículo de extracción y las instrucciones de ruta',
  'llegarán a través del Agente F.',
  '',
  'No comuniquen esta transmisión a civiles.'
];

const gearLines = [
  '',
  '__HEAD__DIRECTIVA DE EQUIPAMIENTO — AMBOS AGENTES',
  '',
  '– Bikinis y accesorios de playa.',
  '– Ropa casual variada, cómoda y de buen mimetismo.',
  '– Un conjunto para "cena de gala". No todo serán misiones diurnas.',
  '– Bañador táctico de refuerzo. Agente L ya sabe cuál.',
  '– Chanclas y calzado que combine con el resto del equipo.',
  '– Gafas de sol y protección solar de alta potencia.',
  '– Dos capas de abrigo ligeras por agente (sudadera o cortavientos).',
  '– El paraguas. Sí, otra vez. Es incuestionable — órdenes de arriba.',
  '',
  'Pulsad "Iniciar misión" en cuanto estéis de camino al destino,',
  'guiados por el Agente F.',
  '',
  'Toda objeción queda registrada pero no será atendida.',
  '-- AGENCIA X CENTRAL --'
];

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function revealLines(lines){
  decrypt.classList.add('show');
  const created = [];
  for(const raw of lines){
    const div = document.createElement('div');
    let text = raw;
    div.className = 'line';
    if(text.startsWith('__HEAD__')){
      text = text.replace('__HEAD__','');
      div.className += ' head';
      div.textContent = text;
    } else if(text.startsWith('>')){
      div.innerHTML = '<span class="prompt">'+text.slice(0,1)+'</span>'+text.slice(1);
    } else if(text.startsWith('--')){
      div.innerHTML = '<span class="sign">'+text+'</span>';
    } else {
      div.textContent = text;
    }
    decrypt.appendChild(div);
    created.push(div);
    await sleep(30);
    div.classList.add('in');
    await sleep(text === '' ? 120 : 340);
  }
  return created;
}

btn.addEventListener('click', async () => {
  btn.disabled = true;
  btn.textContent = 'Transmitiendo señal...';
  status.innerHTML = 'ESTADO: TRANSMISIÓN EN CURSO<span class="cursor">_</span>';
  flash.classList.add('active');

  await sleep(2200);
  flash.classList.remove('active');
  status.innerHTML = 'ESTADO: TRANSMISIÓN COMPLETA<span class="cursor">_</span>';
  btn.textContent = 'Transmisión completa';

  const connectEls = await revealLines(connectLines);
  await sleep(450);
  connectEls.forEach(el => el.classList.add('out'));
  await sleep(320);
  connectEls.forEach(el => el.remove());

  await revealLines(introLines);
  await sleep(700);
  await revealLines(gearLines);

  await sleep(500);
  missionBtn.style.display = 'inline-block';
  missionBtn.classList.add('show');
});

missionBtn.addEventListener('click', () => {
  window.location.href = 'fase-2.html';
});
</script>

</body>
</html>
